<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Flow Capsule</title>
    <link rel="stylesheet" href="./capsule.css" />
  </head>
  <body>
    <main class="capsule" id="capsule" data-state="idle">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" />
          <path
            d="M6 11a6 6 0 0 0 12 0"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <line
            x1="12"
            y1="17"
            x2="12"
            y2="21"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <div class="body">
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="spinner" aria-hidden="true"></span>
        <div class="wave" id="wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <span class="message" id="message">Pronto</span>
        <span class="timer" id="timer">00:00</span>
      </div>

      <span class="notice" aria-live="polite">
        <svg class="notice-icon clip" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <rect x="5" y="4.5" width="14" height="16.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" />
          <rect x="8.5" y="2.5" width="7" height="4" rx="1.2" fill="currentColor" />
        </svg>
        <svg class="notice-icon alert" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M12 7.5v5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="12" cy="16.4" r="1.25" fill="currentColor" />
        </svg>
        <span class="notice-text" id="noticeText"></span>
      </span>

      <div class="actions">
        <button
          class="act discard"
          id="discardButton"
          type="button"
          aria-label="Descartar"
        >
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
            <path
              d="M6 6l12 12M18 6L6 18"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          class="act confirm"
          id="confirmButton"
          type="button"
          aria-label="Confirmar"
        >
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path
              d="M5 12.5l4.5 4.5L19 7"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
        </button>
      </div>
    </main>
    <script type="module" src="./capsule.js"></script>
  </body>
</html>
